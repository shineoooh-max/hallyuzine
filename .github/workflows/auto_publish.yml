name: HALLYUZINE Auto Publish

on:
  schedule:
    # 한국시간(KST) 08:15, 10:15, 12:15, 14:15, 16:15, 18:15, 20:15, 22:15 실행 (하루 8회)
    - cron: '15 23,1,3,5,7,9,11,13 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Syntax check before run
        run: |
          python -m py_compile config.py parser.py builder.py

      - name: Run HALLYUZINE builder
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python -u builder.py

      - name: Commit and push generated site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add posts_meta.json dist/
          [ -f weekly_debate.json ] && git add weekly_debate.json || true
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: publish new HALLYUZINE issue" && git push)
