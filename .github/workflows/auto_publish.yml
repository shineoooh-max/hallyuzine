name: HALLYUZINE Auto Publish

on:
  schedule:
    # 한국시간(KST) 오전 08:25, 오후 08:25 실행 (UTC 23:25, 11:25)
    - cron: '25 23,11 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Syntax check before run
        run: |
          python -m py_compile config.py parser.py builder.py

      - name: Run HALLYUZINE builder
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python builder.py

      - name: Commit and push generated site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add posts_meta.json dist/
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: publish new HALLYUZINE issue" && git push)
