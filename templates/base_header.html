<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title><!--{{PAGE_TITLE}}--></title>
  <meta name="description" content="<!--{{META_DESCRIPTION}}-->" />
  <link rel="canonical" href="<!--{{CANONICAL_URL}}-->" />

  <!-- Open Graph / Social -->
  <meta property="og:type" content="<!--{{OG_TYPE}}-->" />
  <meta property="og:site_name" content="HALLYUZINE" />
  <meta property="og:title" content="<!--{{PAGE_TITLE}}-->" />
  <meta property="og:description" content="<!--{{META_DESCRIPTION}}-->" />
  <meta property="og:image" content="<!--{{OG_IMAGE}}-->" />
  <meta property="og:url" content="<!--{{CANONICAL_URL}}-->" />
  <meta name="twitter:card" content="summary_large_image" />

  <!-- Google Fonts: Broadsheet Serif & Clean Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;0,900;1,600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <!--{{JSON_LD_SCHEMA}}-->

  <style>
    :root {
      --paper-bg: #F7F5F0;
      --paper-card: #EFECE4;
      --ink-black: #111111;
      --ink-muted: #58554E;
      --accent-red: #C81E2B;
      --border-thin: 1px solid #111111;
      --border-thick: 2px solid #111111;
      --font-serif: 'Playfair Display', Georgia, serif;
      --font-sans: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      border-radius: 0 !important;
      box-shadow: none !important;
    }

    html, body {
      margin: 0;
      padding: 0;
      background-color: var(--paper-bg);
      color: var(--ink-black);
      font-family: var(--font-sans);
      line-height: 1.65;
      -webkit-font-smoothing: antialiased;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    img {
      display: block;
      max-width: 100%;
    }

    /* 정통 종이신문 마스트헤드 */
    .masthead-wrap {
      max-width: 1180px;
      margin: 0 auto;
      background-color: var(--paper-bg);
      border-left: var(--border-thin);
      border-right: var(--border-thin);
    }

    @media (max-width: 1180px) {
      .masthead-wrap {
        border-left: none;
        border-right: none;
      }
    }

    .dateline-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.45rem 1.25rem;
      border-bottom: var(--border-thin);
      font-size: 0.68rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--ink-muted);
    }

    .masthead-title-box {
      text-align: center;
      padding: 1.15rem 1rem 1rem;
      border-bottom: var(--border-thick);
    }

    .masthead-logo {
      font-family: var(--font-serif);
      font-weight: 900;
      font-size: clamp(2.1rem, 5vw, 3.4rem);
      letter-spacing: 0.08em;
      line-height: 1;
      color: var(--ink-black);
      display: inline-block;
    }

    /* 1줄 가로 스크롤 고정 카테고리 내비게이션 */
    .sticky-nav {
      position: sticky;
      top: 0;
      z-index: 1000;
      background-color: var(--paper-bg);
      border-bottom: var(--border-thick);
    }

    .category-nav {
      max-width: 1180px;
      margin: 0 auto;
      display: flex;
      flex-wrap: nowrap;
      overflow-x: auto;
      scrollbar-width: none;
      -webkit-overflow-scrolling: touch;
      border-left: var(--border-thin);
      border-right: var(--border-thin);
    }

    @media (max-width: 1180px) {
      .category-nav {
        border-left: none;
        border-right: none;
      }
    }

    .category-nav::-webkit-scrollbar {
      display: none;
    }

    .category-nav a {
      flex: 0 0 auto;
      padding: 0.65rem 1.25rem;
      font-size: 0.74rem;
      font-weight: 800;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--ink-black);
      border-right: var(--border-thin);
      white-space: nowrap;
      transition: background-color 0.15s ease, color 0.15s ease;
    }

    .category-nav a:hover,
    .category-nav a.active {
      background-color: var(--ink-black);
      color: var(--paper-bg);
    }

    /* 공통 컨테이너 */
    .container {
      max-width: 1180px;
      margin: 0 auto;
      border-left: var(--border-thin);
      border-right: var(--border-thin);
    }

    @media (max-width: 1180px) {
      .container {
        border-left: none;
        border-right: none;
      }
    }

    .cat-tag {
      display: inline-block;
      font-size: 0.68rem;
      font-weight: 800;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--accent-red);
    }

    /* 푸터 */
    .site-footer {
      border-top: var(--border-thick);
      background-color: var(--ink-black);
      color: var(--paper-bg);
      padding: 2.5rem 1.25rem;
      margin-top: 3rem;
    }

    .footer-inner {
      max-width: 1180px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .footer-brand {
      font-family: var(--font-serif);
      font-size: 1.5rem;
      font-weight: 900;
      letter-spacing: 0.08em;
    }

    .footer-desc {
      font-size: 0.82rem;
      color: rgba(247, 245, 240, 0.75);
      max-width: 580px;
      margin: 0;
    }

    .footer-links {
      display: flex;
      flex-wrap: wrap;
      gap: 1.25rem;
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      padding-top: 0.75rem;
      border-top: 1px solid rgba(247, 245, 240, 0.2);
    }

    .footer-copy {
      font-size: 0.72rem;
      color: rgba(247, 245, 240, 0.55);
    }
  </style>
</head>
<body>
  <div class="masthead-wrap">
    <div class="dateline-bar">
      <span>SEOUL EDITION • GLOBAL K-CULTURE BROADSHEET</span>
      <span><!--{{ISSUE_DATE}}--></span>
    </div>
    <div class="masthead-title-box">
      <a href="index.html" class="masthead-logo">HALLYUZINE</a>
    </div>
  </div>
  <nav class="sticky-nav" aria-label="Magazine Sections">
    <div class="category-nav">
      <a href="index.html" class="<!--{{NAV_HOME_ACTIVE}}-->">ALL</a>
      <a href="music.html" class="<!--{{NAV_MUSIC_ACTIVE}}-->">MUSIC</a>
      <a href="ott.html" class="<!--{{NAV_OTT_ACTIVE}}-->">OTT &amp; FILM</a>
      <a href="style.html" class="<!--{{NAV_STYLE_ACTIVE}}-->">STYLE</a>
      <a href="culture.html" class="<!--{{NAV_CULTURE_ACTIVE}}-->">CULTURE</a>
    </div>
  </nav>
