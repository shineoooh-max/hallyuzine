<style>
  .article-layout {
    display: grid;
    grid-template-columns: 1fr;
  }

  @media (min-width: 1024px) {
    .article-layout {
      grid-template-columns: 1fr 330px;
    }
  }

  .article-main {
    padding: 1.75rem 1.25rem 2.5rem;
  }

  @media (min-width: 1024px) {
    .article-main {
      padding: 2.5rem 2.75rem 3.5rem;
      border-right: var(--border-thin);
    }
  }

  .article-header {
    margin-bottom: 1.5rem;
    padding-bottom: 1.25rem;
    border-bottom: var(--border-thin);
  }

  .article-title {
    font-family: var(--font-serif);
    font-size: clamp(1.75rem, 4vw, 2.75rem);
    font-weight: 900;
    line-height: 1.15;
    margin: 0.35rem 0 0.85rem 0;
  }

  .article-subtitle {
    font-size: 1.05rem;
    line-height: 1.55;
    color: var(--ink-muted);
    margin: 0 0 1rem 0;
  }

  .article-byline {
    font-size: 0.72rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--ink-muted);
  }

  .article-hero-figure {
    margin: 0 0 1.75rem 0;
    border: var(--border-thin);
    background-color: var(--paper-card);
  }

  .article-hero-figure img {
    width: 100%;
    height: auto;
    display: block;
  }

  .article-hero-caption {
    padding: 0.55rem 0.85rem;
    font-size: 0.72rem;
    color: var(--ink-muted);
    border-top: var(--border-thin);
    letter-spacing: 0.02em;
    line-height: 1.45;
  }

  .dossier-box {
    border: var(--border-thick);
    background-color: var(--paper-card);
    padding: 1.25rem;
    margin: 1.75rem 0;
  }

  .dossier-header {
    font-family: var(--font-serif);
    font-size: 0.95rem;
    font-weight: 900;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    padding-bottom: 0.6rem;
    margin-bottom: 0.85rem;
    border-bottom: var(--border-thin);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .dossier-badge {
    font-family: var(--font-sans);
    font-size: 0.65rem;
    font-weight: 800;
    letter-spacing: 0.08em;
    background-color: var(--accent-red);
    color: var(--paper-bg);
    padding: 0.18rem 0.5rem;
  }

  .dossier-box ul {
    margin: 0;
    padding-left: 1.15rem;
    font-size: 0.92rem;
    line-height: 1.65;
  }

  .dossier-box li {
    margin-bottom: 0.4rem;
  }

  .article-body {
    font-size: 1.03rem;
    line-height: 1.78;
    color: var(--ink-black);
  }

  .article-body h2,
  .article-body h3 {
    font-family: var(--font-serif);
    font-size: 1.35rem;
    font-weight: 800;
    line-height: 1.3;
    margin: 2.25rem 0 0.85rem 0;
    padding-top: 1.25rem;
    border-top: var(--border-thin);
  }

  .article-body p {
    margin: 0 0 1.25rem 0;
  }

  .article-inline-figure {
    margin: 1.75rem 0;
    border: var(--border-thin);
    background-color: var(--paper-card);
  }

  .article-inline-figure img {
    width: 100%;
    height: auto;
    display: block;
    cursor: zoom-in;
  }

  .article-inline-caption {
    padding: 0.5rem 0.8rem;
    font-size: 0.72rem;
    color: var(--ink-muted);
    border-top: var(--border-thin);
    line-height: 1.45;
  }

  .article-gallery {
    margin: 2.25rem 0 1.5rem 0;
    padding-top: 1.25rem;
    border-top: var(--border-thick);
  }

  .article-gallery-title {
    font-family: var(--font-serif);
    font-size: 0.95rem;
    font-weight: 900;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    margin: 0 0 1rem 0;
  }

  .gallery-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 1rem;
    align-items: start;
  }

  @media (max-width: 600px) {
    .gallery-grid {
      grid-template-columns: 1fr;
    }
  }

  .gallery-item {
    margin: 0;
    border: var(--border-thin);
    background-color: var(--paper-card);
  }

  .gallery-item img {
    width: 100%;
    height: auto;
    display: block;
    cursor: zoom-in;
  }

  .gallery-item figcaption {
    padding: 0.45rem 0.65rem;
    font-size: 0.7rem;
    color: var(--ink-muted);
    border-top: var(--border-thin);
    line-height: 1.4;
  }

  .photo-lightbox {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 9999;
    background: rgba(17, 17, 17, 0.92);
    padding: 2rem 1.25rem;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 0.75rem;
    cursor: zoom-out;
  }

  .photo-lightbox.open {
    display: flex;
  }

  .photo-lightbox img {
    max-width: min(92vw, 1100px);
    max-height: 82vh;
    width: auto;
    height: auto;
    border: 1px solid rgba(247, 245, 240, 0.35);
  }

  .photo-lightbox-caption {
    color: #F7F5F0;
    font-size: 0.8rem;
    text-align: center;
    max-width: 760px;
  }

  .article-source-note {
    margin-top: 2rem;
    padding-top: 1rem;
    border-top: var(--border-thin);
    font-size: 0.78rem;
    color: var(--ink-muted);
  }

  .next-issue-block {
    display: grid;
    grid-template-columns: 96px 1fr;
    gap: 1rem;
    align-items: center;
    margin-top: 2.5rem;
    padding: 1.1rem;
    border: var(--border-thick);
    background-color: var(--paper-card);
    transition: background-color 0.15s ease;
  }

  .next-issue-block:hover {
    background-color: #E4E0D5;
  }

  .next-issue-thumb {
    aspect-ratio: 1 / 1;
    width: 100%;
    border: var(--border-thin);
    overflow: hidden;
  }

  .next-issue-thumb img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  .next-issue-kicker {
    font-size: 0.68rem;
    font-weight: 800;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--accent-red);
    margin-bottom: 0.3rem;
  }

  .next-issue-title {
    font-family: var(--font-serif);
    font-size: 1.08rem;
    font-weight: 700;
    line-height: 1.3;
    margin: 0;
  }

  .article-sidebar {
    padding: 1.75rem 1.25rem;
    background-color: var(--paper-bg);
  }

  .sidebar-sticky {
    position: sticky;
    top: 4rem;
  }

  .sidebar-title {
    font-family: var(--font-serif);
    font-size: 0.95rem;
    font-weight: 900;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    padding-bottom: 0.6rem;
    margin: 0 0 1rem 0;
    border-bottom: var(--border-thin);
  }

  .sidebar-list {
    display: flex;
    flex-direction: column;
    gap: 1rem;
  }

  .sidebar-item {
    display: flex;
    gap: 0.75rem;
    align-items: flex-start;
    padding-bottom: 1rem;
    border-bottom: var(--border-thin);
  }

  .sidebar-thumb {
    width: 28%;
    flex: 0 0 28%;
    position: relative;
    border: var(--border-thin);
    background-color: var(--paper-card);
    overflow: hidden;
  }

  .sidebar-thumb img {
    width: 100%;
    height: auto;
    display: block;
  }

  .sidebar-rank-badge {
    position: absolute;
    top: 0;
    left: 0;
    background-color: #111111;
    color: #F7F5F0;
    font-size: 0.62rem;
    font-weight: 800;
    line-height: 1;
    padding: 0.22rem 0.36rem;
    letter-spacing: 0.05em;
  }

  .sidebar-info {
    width: 72%;
    flex: 1 1 72%;
    min-width: 0;
  }

  .sidebar-item-title {
    font-family: var(--font-serif);
    font-size: 0.94rem;
    font-weight: 700;
    line-height: 1.32;
    margin: 0.2rem 0 0 0;
  }
</style>

<div id="photoLightbox" class="photo-lightbox" role="dialog" aria-modal="true" aria-label="Enlarged Photo">
  <img id="lightboxImg" src="" alt="" />
  <div id="lightboxCaption" class="photo-lightbox-caption"></div>
</div>

<script>
  (function () {
    const lb = document.getElementById('photoLightbox');
    const lbImg = document.getElementById('lightboxImg');
    const lbCap = document.getElementById('lightboxCaption');
    if (!lb || !lbImg || !lbCap) return;

    document.querySelectorAll('.js-zoomable').forEach(img => {
      img.addEventListener('click', () => {
        lbImg.src = img.src;
        lbImg.alt = img.alt || '';
        lbCap.textContent = img.dataset.caption || img.alt || '';
        lb.classList.add('open');
      });
    });

    lb.addEventListener('click', () => lb.classList.remove('open'));
    document.addEventListener('keydown', e => {
      if (e.key === 'Escape') lb.classList.remove('open');
    });
  })();
</script>
