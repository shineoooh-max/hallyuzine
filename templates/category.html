<!--{{BASE_HEADER}}-->

<style>
  .cat-header {
    padding: 2.25rem 1.25rem;
    border-bottom: var(--border-thick);
    background-color: var(--paper-card);
  }

  .cat-header-kicker {
    font-size: 0.7rem;
    font-weight: 700;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--accent-red);
    margin-bottom: 0.4rem;
  }

  .cat-header-title {
    font-family: var(--font-serif);
    font-size: clamp(1.85rem, 4vw, 2.75rem);
    font-weight: 900;
    line-height: 1.15;
    margin: 0 0 0.6rem 0;
  }

  .cat-header-desc {
    font-size: 0.92rem;
    color: var(--ink-muted);
    max-width: 640px;
    margin: 0;
  }

  .cat-grid {
    display: grid;
    grid-template-columns: 1fr;
  }

  @media (min-width: 768px) {
    .cat-grid {
      grid-template-columns: repeat(2, 1fr);
    }
  }

  @media (min-width: 1080px) {
    .cat-grid {
      grid-template-columns: repeat(3, 1fr);
    }
  }

  .cat-card {
    display: flex;
    flex-direction: column;
    border-bottom: var(--border-thin);
    background-color: var(--paper-bg);
    transition: background-color 0.15s ease;
  }

  .cat-card:hover {
    background-color: var(--paper-card);
  }

  @media (min-width: 768px) and (max-width: 1079px) {
    .cat-card:nth-child(odd) {
      border-right: var(--border-thin);
    }
  }

  @media (min-width: 1080px) {
    .cat-card:not(:nth-child(3n)) {
      border-right: var(--border-thin);
    }
  }

  .cat-card-thumb {
    aspect-ratio: 16 / 10;
    width: 100%;
    border-bottom: var(--border-thin);
    overflow: hidden;
    background-color: #DCD7CA;
  }

  .cat-card-thumb img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  .cat-card-body {
    padding: 1.25rem;
    display: flex;
    flex-direction: column;
    flex: 1;
  }

  .cat-card-title {
    font-family: var(--font-serif);
    font-size: 1.22rem;
    font-weight: 700;
    line-height: 1.28;
    margin: 0 0 0.65rem 0;
  }

  .cat-card-excerpt {
    font-size: 0.86rem;
    color: var(--ink-muted);
    line-height: 1.55;
    margin: 0 0 1rem 0;
  }

  .cat-card-date {
    margin-top: auto;
    font-size: 0.7rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--ink-muted);
  }
</style>

<main class="container">
  <section class="cat-header">
    <div class="cat-header-kicker">SECTION ARCHIVE</div>
    <h1 class="cat-header-title"><!--{{CATEGORY_TITLE}}--></h1>
    <p class="cat-header-desc"><!--{{CATEGORY_DESCRIPTION}}--></p>
  </section>

  <section class="cat-grid">
    <!--{{CATEGORY_ARTICLES}}-->
  </section>
</main>
