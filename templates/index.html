<!--{{BASE_HEADER}}-->

<style>
  /* 1. 매거진 표지형 히어로 커버 */
  .hero-cover {
    position: relative;
    width: 100%;
    height: 76svh;
    min-height: 460px;
    max-height: 720px;
    border-bottom: var(--border-thick);
    overflow: hidden;
    background-color: var(--ink-black);
  }

  .hero-cover img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center 20%;
    opacity: 0.88;
  }

  .hero-overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    padding: 2rem 1.5rem;
    background: linear-gradient(to top, rgba(20, 20, 20, 0.96) 0%, rgba(20, 20, 20, 0.52) 55%, rgba(20, 20, 20, 0.08) 100%);
    color: var(--paper-bg);
  }

  .hero-kicker {
    display: inline-block;
    background-color: var(--accent-red);
    color: #FFFFFF;
    font-size: 0.68rem;
    font-weight: 700;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    padding: 0.25rem 0.6rem;
    margin-bottom: 0.85rem;
    align-self: flex-start;
  }

  .hero-title {
    font-family: var(--font-serif);
    font-size: clamp(1.85rem, 4.5vw, 3.35rem);
    font-weight: 900;
    line-height: 1.12;
    margin: 0 0 0.75rem 0;
    max-width: 820px;
  }

  .hero-excerpt {
    font-size: 0.95rem;
    line-height: 1.55;
    color: rgba(244, 241, 234, 0.86);
    margin: 0 0 1rem 0;
    max-width: 660px;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  .hero-meta {
    font-size: 0.72rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: rgba(244, 241, 234, 0.68);
  }

  /* 섹션 헤더 바 */
  .section-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0.85rem 1.25rem;
    border-bottom: var(--border-thin);
    background-color: var(--paper-card);
  }

  .section-bar h2 {
    font-family: var(--font-serif);
    font-size: 1.05rem;
    font-weight: 800;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    margin: 0;
  }

  .section-hint {
    font-size: 0.68rem;
    font-weight: 600;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--ink-muted);
  }

  /* 2. Featured 가로 스와이프 카드 덱 (모바일 85% + 15% peek / PC 3단 그리드) */
  .swipe-deck {
    display: flex;
    overflow-x: auto;
    scroll-snap-type: x mandatory;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
    border-bottom: var(--border-thick);
  }
  .swipe-deck::-webkit-scrollbar {
    display: none;
  }

  .swipe-card {
    flex: 0 0 85%;
    scroll-snap-align: start;
    border-right: var(--border-thin);
    display: flex;
    flex-direction: column;
    background-color: var(--paper-bg);
    transition: background-color 0.15s ease;
  }

  .swipe-card:hover {
    background-color: var(--paper-card);
  }

  @media (min-width: 900px) {
    .swipe-deck {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      overflow-x: visible;
    }
    .swipe-card {
      flex: none;
    }
    .swipe-card:nth-child(3n) {
      border-right: none;
    }
    .swipe-hint-mobile {
      display: none;
    }
  }

  .card-thumb {
    aspect-ratio: 16 / 10;
    width: 100%;
    overflow: hidden;
    border-bottom: var(--border-thin);
    background-color: #DCD7CA;
  }

  .card-thumb img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  .card-body {
    padding: 1.25rem;
    display: flex;
    flex-direction: column;
    flex: 1;
  }

  .card-title {
    font-family: var(--font-serif);
    font-size: 1.22rem;
    font-weight: 700;
    line-height: 1.28;
    margin: 0 0 0.65rem 0;
  }

  .card-summary {
    font-size: 0.86rem;
    color: var(--ink-muted);
    line-height: 1.55;
    margin: 0 0 1rem 0;
    display: -webkit-box;
    -webkit-line-clamp: 3;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  .card-date {
    margin-top: auto;
    font-size: 0.7rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--ink-muted);
  }

  /* 3. 최신 기사 종이신문 1면 피드 (모바일 1단 / PC 2단 비대칭) */
  .news-grid {
    display: grid;
    grid-template-columns: 1fr;
  }

  @media (min-width: 900px) {
    .news-grid {
      grid-template-columns: repeat(2, 1fr);
    }
  }

  .news-row {
    display: grid;
    grid-template-columns: 112px 1fr;
    gap: 1rem;
    padding: 1.25rem;
    border-bottom: var(--border-thin);
    align-items: start;
    transition: background-color 0.15s ease;
  }

  .news-row:hover {
    background-color: var(--paper-card);
  }

  @media (min-width: 900px) {
    .news-row:nth-child(odd) {
      border-right: var(--border-thin);
    }
    .news-row {
      grid-template-columns: 160px 1fr;
      gap: 1.25rem;
    }
  }

  .news-row-thumb {
    aspect-ratio: 4 / 3;
    width: 100%;
    border: var(--border-thin);
    overflow: hidden;
    background-color: #DCD7CA;
  }

  .news-row-thumb img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  .news-row-title {
    font-family: var(--font-serif);
    font-size: 1.08rem;
    font-weight: 700;
    line-height: 1.32;
    margin: 0 0 0.45rem 0;
  }

  .news-row-meta {
    font-size: 0.7rem;
    color: var(--ink-muted);
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }
</style>

<main class="container">
  <!-- 오늘의 매거진 커버 -->
  <!--{{HERO_COVER}}-->

  <!-- Featured 가로 스와이프 카드 덱 -->
  <div class="section-bar">
    <h2>Editor's Picks</h2>
    <span class="section-hint swipe-hint-mobile">Swipe &rarr;</span>
  </div>
  <section class="swipe-deck" aria-label="Featured Stories">
    <!--{{FEATURED_SWIPE_CARDS}}-->
  </section>

  <!-- 최신 이슈 신문 그리드 -->
  <div class="section-bar">
    <h2>Latest Dispatches</h2>
    <span class="section-hint">Seoul Edition</span>
  </div>
  <section class="news-grid" aria-label="Latest Stories">
    <!--{{LATEST_FEED}}-->
  </section>
</main>
